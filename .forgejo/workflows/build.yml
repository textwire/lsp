name: Build and release

on:
  push:
    tags:
      - "*"

jobs:
  build-and-release:
    runs-on: burn
    name: Build and release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Run GoReleaser
        uses: https://github.com/goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
